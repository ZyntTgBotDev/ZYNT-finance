<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ZYNT FINANCE"><meta name="description" content="Личная финансовая аналитика ZYNT FINANCE"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/zynt-icon-192.png"><link rel="stylesheet" href="css/style.css"><title>ZYNT FINANCE</title></head><body>
<div id="splash" class="screen splash"><div class="orb"></div><div class="logo">Z</div><div class="brand">ZYNT <b>FINANCE</b></div><div id="greeting" class="greeting">Твои финансы. Твои правила.</div><div class="loader"><i></i></div></div>
<section id="gate" class="screen auth hidden"><div class="logo">Z</div><div class="brand">ZYNT <b>FINANCE</b></div><h1>Доступ к приложению</h1><p>Введи код первого запуска</p><form id="gateForm"><input id="gateCode" type="password" inputmode="numeric" placeholder="Код доступа" required><button>Продолжить</button></form><div id="gateError" class="error"></div></section>
<section id="approved" class="screen auth hidden"><div class="logo">Z</div><div class="brand">ZYNT <b>FINANCE</b></div><div id="written" class="handwrite"></div><button id="approvedNext">Продолжить</button></section>
<section id="register" class="screen auth hidden"><div class="logo">Z</div><h1>Добро пожаловать</h1><p>Создай свой финансовый профиль</p><form id="registerForm"><input id="name" placeholder="Твоё имя" maxlength="40" required><input id="currency" value="RUB" disabled><input id="balance" type="number" min="0" step="0.01" placeholder="Начальный баланс, ₽"><button>Создать профиль</button></form></section>
<div id="app" class="app hidden"><header><div class="brand">ZYNT <b>FINANCE</b></div><button id="themeOpen" class="iconbtn">◐</button></header><main id="view"></main><nav><button data-tab="home">⌂<small>Главная</small></button><button data-tab="records">⇄<small>Операции</small></button><button data-tab="tasks">✦<small>Задания</small></button><button data-tab="stats">▥<small>Аналитика</small></button><button data-tab="profile">◉<small>Профиль</small></button></nav></div>
<div id="modal" class="modal hidden"><div class="dialog"><button class="close" id="closeModal">×</button><div id="modalBody"></div></div></div><div id="toast" class="toast"></div><script src="js/app.js"></script><script>if('serviceWorker'in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
